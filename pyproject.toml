[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naijafinsent"
version = "0.1.0"
description = "Nigeria-focused financial NLP and event-intelligence platform with an open benchmark (NaijaFin-Bench)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NaijaFinSent contributors" }]
keywords = ["nlp", "finance", "nigeria", "sentiment", "ner", "events", "benchmark"]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "trafilatura>=1.8",
    "python-dateutil>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "datasketch>=1.6",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20",
]
ml = [
    "transformers>=4.40",
    "tokenizers>=0.19",
    "seqeval>=1.2",
    "spacy>=3.7",
    "python-crfsuite>=0.9",
]
llm = ["anthropic>=0.34"]
efficiency = ["onnxruntime>=1.17"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[project.scripts]
naijafinsent = "naijafinsent.cli:main"

[tool.setuptools.packages.find]
include = ["naijafinsent*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "research/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "network: tests that hit the network (deselected by default in CI)",
]

[tool.coverage.run]
source = ["naijafinsent"]
omit = ["*/tests/*"]
