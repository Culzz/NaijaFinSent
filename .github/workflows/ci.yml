name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
          pip install httpx   # testclient dependency

      - name: Lint (ruff, best-effort)
        run: ruff check naijafinsent services apps || true
        continue-on-error: true

      - name: Architecture guard — core stays framework-free
        run: pytest tests/test_architecture.py -q

      - name: Tests
        run: pytest -q --maxfail=5

      - name: API smoke
        run: python scripts/smoke_api.py

  eval-regression-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Eval regression gate (golden set vs frozen baseline)
        run: python scripts/eval_gate.py --tolerance 0.02
