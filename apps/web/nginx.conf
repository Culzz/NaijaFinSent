# Static hosting for the NaijaFinSent web console (SPA).
# Note: the page itself says "not investment advice" and only displays
# measurements of language in published coverage.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA history fallback: any unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the shell — it references hashed bundles.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Proxy the API so the browser talks same-origin in container deployments.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Baseline hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;
}
