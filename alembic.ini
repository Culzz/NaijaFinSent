# Alembic configuration for NaijaFinSent.
#
# The URL is deliberately NOT set here. `services/api/alembic/env.py` reads it
# from `naijafinsent.config.get_settings().database_url`, so there is exactly one
# source of truth for the connection string and migrations can never drift onto
# a different database than the app uses.
#
# Usage (from the repo root, with the venv active):
#   .\.venv\Scripts\python.exe -m alembic -c alembic.ini upgrade head
#   .\.venv\Scripts\python.exe -m alembic -c alembic.ini revision -m "add x"

[alembic]
script_location = services/api/alembic
prepend_sys_path = .
# Timestamped revision filenames keep the versions/ directory readable.
file_template = %%(rev)s_%%(slug)s
# Truncate the slug so long messages do not produce unreadable filenames.
truncate_slug_length = 40
version_path_separator = os

# `sqlalchemy.url` is intentionally omitted: env.py injects it from settings.
# Setting it here as a placeholder would invite someone to edit the wrong value.
sqlalchemy.url =

[post_write_hooks]
# Optional: format generated migrations with ruff if it is available.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
